    <script>
        const pageDivs = document.querySelectorAll('.Page[data-page]');

        function loadPage(div, fileName){
            // const pageName = div.getAttribute('data-page');
            // const fileName = './static/' + pageName + "/" + pageName + '.html';

            fetch(fileName)
                .then(response => {
                if (!response.ok) throw new Error(`Failed to load ${fileName}`);
                return response.text();
                })
                .then(html => {
                div.innerHTML = html;
                })
                .catch(error => {
                div.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                });
            
        }

        loadPage(document.querySelector('.navigation-wrap'), "./static/home/navigation.html")
        loadPage(document.querySelector('.about-us-container'), "./static/home/home.html");
        loadPage(document.querySelector('.team-section'), "./static/home/team.html");
        // loadPage(document.querySelector(".event-container"), "./static/events-and-projects/events.html");
        // loadPage(document.querySelector(".project-container"), "./static/events-and-projects/projects.html");
        loadPage(document.querySelector(".contact-section"), "./static/home/contact.html")


        
    </script>
